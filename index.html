<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7cc6ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Glove Story" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Glove Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="lives"><span class="glove-icon">✋</span><span id="lives-n">×5</span></div>
      <div id="hearts"></div>
    </div>
    <div id="hud-center">
      <div id="garibs"><span class="garib-icon"></span><span id="garibs-n">0/0</span></div>
    </div>
    <div id="hud-right">
      <div id="ball-form">Crystal</div>
      <button id="pause-btn" aria-label="Pause">❚❚</button>
    </div>
    <div id="sign" class="hidden"></div>
    <div id="toast"></div>
    <div id="ball-arrow" class="hidden"></div>
    <div id="prompt" class="hidden"></div>
  </div>

  <!-- Touch controls -->
  <div id="touch" class="hidden">
    <div id="stick-base" class="hidden"><div id="stick-knob"></div></div>
    <div id="stick-hint">move</div>
    <button class="tbtn" id="btn-slap" data-btn="slap">SLAP</button>
    <button class="tbtn" id="btn-grab" data-btn="grab">GRAB</button>
    <button class="tbtn" id="btn-jump" data-btn="jump">JUMP</button>
  </div>

  <!-- Screens -->
  <div id="title" class="screen">
    <div class="logo">
      <div class="logo-top">GLOVE</div>
      <div class="logo-bottom">STORY</div>
    </div>
    <div class="tagline">a little homage to a 1998 classic</div>
    <button id="start-btn" class="big-btn">Play</button>
    <div id="controls-help" class="controls-help"></div>
    <div id="rotate-hint">Tip: turn your phone sideways ↻</div>
  </div>

  <div id="select" class="screen hidden">
    <h2>Pick a world</h2>
    <div id="level-cards"></div>
    <button class="menu-btn" id="select-back">Back</button>
  </div>

  <div id="pause" class="screen hidden">
    <h2>Paused</h2>
    <button class="big-btn" id="resume-btn">Resume</button>
    <button class="menu-btn" id="checkpoint-btn">Back to checkpoint</button>
    <button class="menu-btn" id="restart-btn">Restart level</button>
    <button class="menu-btn" id="map-btn">World map</button>
    <button class="menu-btn" id="music-btn">Music: on</button>
    <button class="menu-btn" id="retro-btn">Retro pixels: off</button>
    <button class="menu-btn" id="fullscreen-btn">Fullscreen</button>
    <div class="controls-help" id="pause-controls"></div>
  </div>

  <div id="complete" class="screen hidden">
    <h2 id="complete-title">Level Complete!</h2>
    <div id="complete-stats"></div>
    <div class="small" id="complete-note"></div>
    <button class="big-btn" id="next-btn">Next world ▶</button>
    <div class="btn-row">
      <button class="menu-btn" id="again-btn">Play again</button>
      <button class="menu-btn" id="complete-map-btn">World map</button>
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2>Game Over</h2>
    <div class="small">The wizard believes in you.</div>
    <button class="big-btn" id="retry-btn">Try again</button>
    <button class="menu-btn" id="gameover-map-btn">World map</button>
  </div>

  <div id="fade"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
